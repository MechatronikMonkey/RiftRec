# Build the RiftRec Windows installer (EW-89).
#
# Runs the same steps as packaging/build.ps1 on a clean windows runner, so the
# file a participant downloads is built from a known-good environment rather
# than from whatever happens to be installed on a developer machine.
#
# Triggers: every push/PR that touches the app or the packaging (so a broken
# freeze is caught immediately, not on release day), manual dispatch, and a
# `v*` tag, which additionally publishes the installer as a GitHub release -
# the download link that replaces "clone the repo and install Python".
name: build-installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "riftrec/**"
      - "packaging/**"
      - "requirements-recorder.txt"
      - ".github/workflows/build-installer.yml"
  pull_request:
    paths:
      - "riftrec/**"
      - "packaging/**"
      - "requirements-recorder.txt"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release step on a tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-recorder.txt pyinstaller pytest

      # The recorder runs unattended on other people's PCs during a study, so a
      # red test suite must never reach an installer.
      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path riftrec/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "RiftRec version $v"

      - name: Generate the icon
        run: python packaging/make_icon.py

      - name: Freeze the application
        run: pyinstaller --noconfirm --clean packaging/riftrec.spec

      # The failure this whole ticket exists for: a dependency the frozen build
      # does not carry. On a participant's PC that looks like a window that
      # never opens; here it looks like a red build.
      - name: Self-check the frozen build
        shell: pwsh
        run: |
          $log = "$env:APPDATA\RiftRec\riftrec.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath dist\RiftRec\RiftRec.exe -ArgumentList selfcheck -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "selfcheck failed with exit code $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Code signing is a separate track with weeks of lead time (certificate +
      # identity check). When it lands, add the signing secrets and pass
      # /DSIGN /Ssigntool="..." here; nothing else in this workflow changes.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\riftrec.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: RiftRec-Setup-${{ steps.version.outputs.version }}
          path: dist/RiftRec-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RiftRec-Setup-*.exe
          body: |
            Windows installer for RiftRec ${{ steps.version.outputs.version }}.

            Download the .exe, run it, then start RiftRec from the Start menu.
            No Python, no pip, no internet connection needed.

            This build is not code-signed yet, so Windows SmartScreen shows
            "Windows protected your PC" on first run: More info -> Run anyway.

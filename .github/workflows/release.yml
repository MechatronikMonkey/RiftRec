# Cut a RiftRec release (EW-89).
#
# Trigger: a `v*` tag on main. That tag is the "this is the state I want"
# moment - everything else is automatic.
#
#     git checkout main && git pull
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The version itself is bumped beforehand, in riftrec/__init__.py, through a
# normal pull request. This workflow refuses to build if the tag and
# __version__ disagree, so an installer can never be labelled with a version
# that is not the one baked into its own recordings (`session.app_version`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # only the release step needs this

jobs:
  release:
    name: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # needed to prove the tag sits on main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the tag matches riftrec.__version__
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $m = Select-String -Path riftrec/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ($tag -ne $v) {
            throw "Tag v$tag does not match __version__ $v. Bump riftrec/__init__.py in a pull request first, then tag the merge commit."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing RiftRec $v"

      # A release has to be reproducible from main. Tagging a side branch would
      # ship something nobody reviewed.
      - name: Check the tag is on main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "This tag is not an ancestor of origin/main - release only from main."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-recorder.txt pyinstaller pytest

      # Belt and braces: CI already ran these on the pull request, but a tag can
      # be pushed at any commit and a release must never ship a red suite.
      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.version.outputs.version }}

      # Lets anyone check that the file they downloaded is the file that was
      # built here - which matters more than usual while the build is unsigned.
      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $setup = "dist/RiftRec-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $(Split-Path $setup -Leaf)" | Out-File "$setup.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      # Deliberately still v2: this step has never run, and it is the one that
      # publishes the file participants download. Bumping it at the same time as
      # first relying on it would double the unknowns. Move to v3 once a release
      # has actually come out.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: RiftRec ${{ steps.version.outputs.version }}
          files: |
            dist/RiftRec-Setup-*.exe
            dist/RiftRec-Setup-*.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            Download **RiftRec-Setup-${{ steps.version.outputs.version }}.exe** below and run it.
            No Python, no pip and no internet connection are needed on the target PC.

            Windows shows **"Windows protected your PC"** because this build is not
            code-signed yet: **More info → Run anyway**. Your antivirus may also flag a
            program it has never seen before — if it blocks RiftRec, allow it, and please
            say so.

            RiftRec does **not** start with Windows. Put the chest strap on, then start it
            from the Start menu — recording is meant to be a deliberate act.

            `SHA256  ${{ steps.checksum.outputs.sha256 }}`

            See the [pilot guide](https://github.com/${{ github.repository }}#pilot-guide-windows)
            for pairing the Polar H10 and the first run.

            ---

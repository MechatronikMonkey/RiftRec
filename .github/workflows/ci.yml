# Continuous integration for RiftRec.
#
# Runs on every pull request and on main. The two job names below - `tests` and
# `installer` - are the required status checks configured by
# .github/setup-branch-protection.ps1, so renaming a job means updating the
# protection rule as well, or merges will block on a check that never reports.
#
# Both jobs run on every pull request without a paths filter, on purpose: a
# required check that is skipped because a path did not match leaves the pull
# request waiting forever.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-recorder.txt pytest

      # The recorder runs unattended on other people's PCs during a study, so a
      # red suite must never reach a participant.
      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

  installer:
    name: installer
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-recorder.txt pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path riftrec/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.version.outputs.version }}

      # Not a release - just a downloadable build of this branch, so a change to
      # the packaging can be tried on a real machine before it is merged.
      - uses: actions/upload-artifact@v4
        with:
          name: RiftRec-Setup-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/RiftRec-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
